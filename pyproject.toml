[project]
name = "arzan-quant-research"
version = "0.2.0"
description = "Price-shock propagation research using private Arzan grocery data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arzan-quant = "arzan_quant.cli:main"

[project.optional-dependencies]
research = [
  "duckdb>=1.2", "pyarrow>=19.0", "pytz>=2024.1", "numpy>=2.1",
  "pandas>=2.2", "scipy>=1.14", "matplotlib>=3.10"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]
data = ["duckdb>=1.2", "pyarrow>=19.0", "pytz>=2024.1"]
research = [
  "matplotlib>=3.10",
  "networkx>=3.4",
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
